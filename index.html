<!DOCTYPE html>
<html>
  <head>
    <title>New Zealand Land Wars Interactive Map</title>

    <!-- Import Leaflet library CSS for styling the map -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />

    <link rel="stylesheet" href="styles.css">

  </head>
  <body>
    <!-- Page Header -->
    <header>
      <h1>New Zealand Land Wars Interactive Map</h1>
    </header>

    <!-- Map container -->
    <div id="map"></div>

    <!-- Import the JavaScript file containing the 'battles' object -->
    <script src="battles.js"></script>

    <div id="sidebar" class="sidebar">
      <button onclick="closeSidebar()">Close</button>
      <div id="sidebar-content"></div>
    </div>
    <script src="open_sidebar.js"></script>

    <!-- Import Leaflet library JavaScript for creating the map -->
    <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

    <script>
      // Initialize the map with settings for center, zoom, and constraints
      const map = L.map("map", {
        center: [-41.2865, 174.7762], // Center of the map (Wellington)
        zoom: 6, // Initial zoom level
        minZoom: 5, // Minimum zoom level to prevent excessive zooming out
        maxZoom: 18, // Maximum zoom level for close-up details
        maxBounds: [
          [-30, 160.0], // Northern and western boundary
          [-50, 190.0], // Southern and eastern boundary
        ],
        maxBoundsViscosity: 10, // Ensures the map "bounces back" when panned beyond bounds
      });

      // Add OpenStreetMap tiles to the map
      L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png").addTo(map);

      // Iterate over the 'battles' object and create map markers for each location
      Object.keys(battles).forEach((battle) => {
        const marker = L.marker(battles[battle].coords).addTo(map); // Add marker to the map
        marker.bindPopup(battles[battle].info); // Bind popup with battle information
      });
    </script>

    <!-- Page Footer -->
    <footer>

    </footer>
  </body>
</html>
