<!DOCTYPE html>
<html>
<head>
  <title>NZ Map</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
  <style>
    #map { height: 500px; width: 100%; }
  </style>
</head>
<body>
  <div id="map"></div>
  <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
  <script>
    const map = L.map('map').setView([-41.2865, 174.7762], 5);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);

    const cities = {
      Wellington: { coords: [-41.2865, 174.7762], info: "Wellington is the capital city of NZ." },
      Auckland: { coords: [-36.8485, 174.7633], info: "Auckland is known as the City of Sails." },
      Christchurch: { coords: [-43.5321, 172.6362], info: "Christchurch is in the South Island." }
    };

    Object.keys(cities).forEach(city => {
      const marker = L.marker(cities[city].coords).addTo(map);
      marker.bindPopup(`<b>${city}</b><br>${cities[city].info}`);
    });
  </script>
</body>
</html>
